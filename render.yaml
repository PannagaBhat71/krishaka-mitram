services:
  - type: web
    name: krishaka-mitram
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn kisan.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
